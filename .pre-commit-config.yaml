# Runs on `git commit` via Husky → .husky/pre-commit → pre-commit run
# Black alone would re-insert two blank lines between top-level defs; we run collapse
# in the same hook after Black so the repo stays on single-blank-line style.
# Entries use bare `python`/`pytest` (not python3 or .venv/bin/...) so they resolve on
# both macOS/Linux and Windows — .husky/pre-commit puts the right venv dir on PATH.
repos:
  - repo: local
    hooks:
      - id: black-then-collapse-blank-lines
        name: Black + single blank line between blocks
        entry: python scripts/black_then_collapse.py
        language: system
        pass_filenames: true
        require_serial: true
        types: [python]
        exclude: ^(ui/|\.venv/)
      - id: pytest
        name: Unit tests
        # -q keeps output compact; the huge -v/verbose stream was slow and glitchy on
        # the Windows console. pre-commit still shows full output if a test fails.
        entry: pytest --tb=short -q --cov-fail-under=99
        language: system
        pass_filenames: false
        always_run: true
