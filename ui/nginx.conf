server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests — strips /py prefix to match FastAPI routes.
    # Uses Docker's embedded DNS (127.0.0.11) with a runtime-resolved variable so
    # nginx starts even if the api container is briefly down, and recovers if it restarts.
    location /py/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        rewrite ^/py/(.*)$ /$1 break;
        proxy_pass http://$api_upstream:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # JVM languages (Kotlin, Scala) can take up to 60s to compile
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # SPA fallback — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
